server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip for the JS/CSS bundles.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # SPA: every non-file route resolves to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API: the browser calls this nginx, which proxies server-side to
    # the gateway — so there is no cross-origin request and no CORS to satisfy.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Long-cache the fingerprinted assets.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
