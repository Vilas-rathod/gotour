# All real configuration is served by the config server. This file only names
# the service and points it there.
spring:
  application:
    name: catalog-service
  config:
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 30
        initial-interval: 2000
        max-interval: 5000
