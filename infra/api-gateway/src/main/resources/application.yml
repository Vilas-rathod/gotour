# Routes, CORS and everything else come from the config server
# (configs/api-gateway.yml + configs/application.yml). This file only names the
# app and points it at the config server.
spring:
  application:
    name: api-gateway
  config:
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 30
        initial-interval: 2000
        max-interval: 5000
