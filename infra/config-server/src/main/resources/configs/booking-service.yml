server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/gotour_booking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

gotour:
  payment:
    # Two methods are offered at checkout: RAZORPAY (online UPI / BHIM) and CASH
    # (pay at the hotel on arrival, hotel bookings only). This is only the
    # default used when a checkout request does not name a method.
    provider: ${GOTOUR_PAYMENT_PROVIDER:RAZORPAY}
    razorpay:
      # Intentionally empty - add your Razorpay credentials here (or via env).
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      api-url: https://api.razorpay.com/v1
